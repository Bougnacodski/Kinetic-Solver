name: Documentation

# Publishes the MkDocs site to the gh-pages branch on every push to master.
# GitHub Pages serves that branch at https://bougnacodski.github.io/Kinetic-Solver/
on:
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Build and publish to gh-pages
        run: mkdocs gh-deploy --strict --force --no-history -m "Deploy documentation from {sha} with MkDocs {version}"
